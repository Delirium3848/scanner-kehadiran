<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>
Kehadiran Murid QR V3
</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eff6ff,
      #f8fafc
    );

  min-height: 100vh;

  color: #0f172a;

}


/* =========================
   CONTAINER
========================= */

.container {

  width: 100%;

  max-width: 600px;

  margin: auto;

  padding: 15px;

}


/* =========================
   HEADER
========================= */

.header {

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #1d4ed8
    );

  color: white;

  border-radius: 22px;

  padding: 20px;

  text-align: center;

  box-shadow:
    0 8px 25px
    rgba(37,99,235,0.25);

  margin-bottom: 15px;

}


.header h1 {

  margin: 0;

  font-size: 25px;

}


.header .school {

  margin-top: 6px;

  font-size: 14px;

  opacity: 0.9;

}


#clock {

  margin-top: 10px;

  font-size: 25px;

  font-weight: bold;

}


#date {

  font-size: 14px;

  margin-top: 3px;

}


/* =========================
   STATISTICS
========================= */

.stats {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-bottom: 15px;

}


.stat {

  background: white;

  border-radius: 16px;

  padding: 15px 8px;

  text-align: center;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.07);

}


.stat-icon {

  font-size: 25px;

}


.stat-number {

  font-size: 28px;

  font-weight: bold;

  margin-top: 3px;

}


.stat-label {

  font-size: 12px;

  color: #64748b;

  margin-top: 3px;

}


.total .stat-number {

  color: #2563eb;

}


.hadir .stat-number {

  color: #16a34a;

}


.belum .stat-number {

  color: #dc2626;

}


/* =========================
   PROGRESS
========================= */

.progress-card {

  background: white;

  border-radius: 18px;

  padding: 18px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.07);

  margin-bottom: 15px;

}


.progress-header {

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  margin-bottom: 10px;

}


.progress-title {

  font-weight: bold;

}


#percentage {

  font-size: 22px;

  font-weight: bold;

  color: #2563eb;

}


.progress {

  width: 100%;

  height: 16px;

  background: #e2e8f0;

  border-radius: 20px;

  overflow: hidden;

}


#progressBar {

  height: 100%;

  width: 0%;

  background:
    linear-gradient(
      90deg,
      #22c55e,
      #16a34a
    );

  border-radius: 20px;

  transition:
    width 0.5s ease;

}


/* =========================
   SCANNER
========================= */

.scanner-card {

  background: white;

  border-radius: 20px;

  padding: 15px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.07);

}


.scanner-title {

  text-align: center;

  font-size: 20px;

  font-weight: bold;

  margin-bottom: 10px;

}


#reader {

  width: 100%;

  max-width: 500px;

  margin: auto;

}


.camera-controls {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

  margin-top: 12px;

}


select {

  width: 100%;

  padding: 13px;

  border:
    1px solid #cbd5e1;

  border-radius: 12px;

  font-size: 15px;

  background: white;

}


button {

  width: 100%;

  padding: 14px;

  border: none;

  border-radius: 12px;

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}


.start {

  background: #2563eb;

}


.stop {

  background: #dc2626;

}


button:disabled {

  background: #94a3b8;

  cursor: not-allowed;

}


/* =========================
   SCAN STATUS
========================= */

#scanStatus {

  margin-top: 12px;

  padding: 12px;

  border-radius: 12px;

  text-align: center;

  background: #eff6ff;

  color: #1d4ed8;

  font-weight: bold;

  font-size: 14px;

}


/* =========================
   RESULT
========================= */

#result {

  display: none;

  margin-top: 15px;

  padding: 20px;

  border-radius: 18px;

  text-align: center;

  animation:
    muncul 0.3s ease;

}


.result-success {

  background: #dcfce7;

  border:
    2px solid #22c55e;

  color: #166534;

}


.result-warning {

  background: #fef9c3;

  border:
    2px solid #eab308;

  color: #854d0e;

}


.result-error {

  background: #fee2e2;

  border:
    2px solid #ef4444;

  color: #991b1b;

}


.result-icon {

  font-size: 45px;

}


.result-title {

  font-size: 22px;

  font-weight: bold;

  margin-top: 5px;

}


.result-name {

  font-size: 22px;

  font-weight: bold;

  margin-top: 10px;

}


.result-info {

  margin-top: 8px;

  font-size: 14px;

  line-height: 1.7;

}


/* =========================
   ERROR
========================= */

#error {

  display: none;

  margin-top: 12px;

  padding: 12px;

  background: #fee2e2;

  color: #991b1b;

  border-radius: 12px;

  font-size: 14px;

  white-space: pre-wrap;

}


/* =========================
   FOOTER
========================= */

.footer {

  text-align: center;

  padding: 20px 5px;

  font-size: 12px;

  color: #64748b;

}


/* =========================
   ANIMATION
========================= */

@keyframes muncul {

  from {

    opacity: 0;

    transform:
      translateY(10px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


/* =========================
   MOBILE
========================= */

@media
(max-width: 420px) {

  .stats {

    gap: 6px;

  }

  .stat {

    padding: 12px 5px;

  }

  .stat-number {

    font-size: 24px;

  }

  .header h1 {

    font-size: 22px;

  }

}

</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>
      📷 KEHADIRAN MURID
    </h1>

    <div class="school">
      Sistem Kehadiran QR
    </div>

    <div id="clock">
      00:00:00
    </div>

    <div id="date">
      --
    </div>

  </div>



  <!-- STATISTICS -->

  <div class="stats">


    <div class="stat total">

      <div class="stat-icon">
        👨‍🎓
      </div>

      <div
        class="stat-number"
        id="jumlahMurid">

        -

      </div>

      <div class="stat-label">
        JUMLAH MURID
      </div>

    </div>


    <div class="stat hadir">

      <div class="stat-icon">
        ✅
      </div>

      <div
        class="stat-number"
        id="jumlahHadir">

        -

      </div>

      <div class="stat-label">
        HADIR
      </div>

    </div>


    <div class="stat belum">

      <div class="stat-icon">
        ⚠️
      </div>

      <div
        class="stat-number"
        id="jumlahBelum">

        -

      </div>

      <div class="stat-label">
        BELUM HADIR
      </div>

    </div>


  </div>



  <!-- PROGRESS -->

  <div class="progress-card">


    <div class="progress-header">

      <div class="progress-title">

        📊 KEHADIRAN HARI INI

      </div>

      <div id="percentage">

        0%

      </div>

    </div>


    <div class="progress">

      <div
        id="progressBar">

      </div>

    </div>


  </div>



  <!-- SCANNER -->

  <div class="scanner-card">


    <div class="scanner-title">

      🔍 SCAN QR MURID

    </div>


    <div id="reader"></div>


    <div class="camera-controls">


      <select
        id="cameraSelect">

        <option value="">
          Mencari kamera...
        </option>

      </select>


      <button
        class="start"
        id="startButton"
        onclick="mulaScan()"
        disabled>

        📷 MULA SCAN

      </button>


    </div>


    <button
      class="stop"
      onclick="hentikanScan()"
      style="margin-top:10px;">

      ⛔ HENTIKAN SCAN

    </button>


    <div id="scanStatus">

      ⏳ Mencari kamera...

    </div>


  </div>



  <!-- RESULT -->

  <div id="result">

    <div
      id="resultIcon"
      class="result-icon">

      🎉

    </div>


    <div
      id="resultTitle"
      class="result-title">

      KEHADIRAN BERJAYA

    </div>


    <div
      id="resultName"
      class="result-name">

    </div>


    <div
      id="resultInfo"
      class="result-info">

    </div>


  </div>



  <!-- ERROR -->

  <div id="error"></div>



  <!-- FOOTER -->

  <div class="footer">

    Sistem Kehadiran QR Murid

  </div>


</div>



<script>


/* =========================================
   CONFIGURATION
========================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx4WM4cm1rNr8QePCjtsRtA4G2_vyQN96Q_KTN7eYkqTqPG5t1Mt65tINazBFtNh9yg/exec";


/* =========================================
   VARIABLES
========================================= */

let scanner = null;

let sedangScan = false;

let cameras = [];

let scanSedangDiproses = false;


/* =========================================
   ELEMENTS
========================================= */

const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const scanStatus =
  document.getElementById(
    "scanStatus"
  );


const result =
  document.getElementById(
    "result"
  );


const resultIcon =
  document.getElementById(
    "resultIcon"
  );


const resultTitle =
  document.getElementById(
    "resultTitle"
  );


const resultName =
  document.getElementById(
    "resultName"
  );


const resultInfo =
  document.getElementById(
    "resultInfo"
  );


const errorBox =
  document.getElementById(
    "error"
  );


/* =========================================
   JAM
========================================= */

function updateClock() {

  const now =
    new Date();


  const jam =
    now.toLocaleTimeString(
      "ms-MY",
      {
        hour12: false
      }
    );


  const tarikh =
    now.toLocaleDateString(
      "ms-MY",
      {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      }
    );


  document.getElementById(
    "clock"
  ).innerText = jam;


  document.getElementById(
    "date"
  ).innerText =
    tarikh;

}


setInterval(
  updateClock,
  1000
);


updateClock();


/* =========================================
   DASHBOARD
========================================= */

async function muatDashboard() {

  try {

    const url =
      APPS_SCRIPT_URL +
      "?action=dashboard&t=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "DASHBOARD:",
      data
    );


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "Gagal mendapatkan dashboard."
      );

    }


    document.getElementById(
      "jumlahMurid"
    ).innerText =
      data.jumlahMurid;


    document.getElementById(
      "jumlahHadir"
    ).innerText =
      data.jumlahHadir;


    document.getElementById(
      "jumlahBelum"
    ).innerText =
      data.jumlahBelumHadir;


    document.getElementById(
      "percentage"
    ).innerText =
      data.peratus +
      "%";


    document.getElementById(
      "progressBar"
    ).style.width =
      Math.min(
        Number(
          data.peratus
        ),
        100
      ) +
      "%";


  } catch (error) {

    console.error(
      "Dashboard error:",
      error
    );

  }

}


/* =========================================
   CARI KAMERA
========================================= */

async function cariKamera() {

  scanStatus.innerText =
    "⏳ Meminta akses kamera...";


  try {

    cameras =
      await Html5Qrcode
        .getCameras();


    console.log(
      "KAMERA:",
      cameras
    );


    if (
      !cameras ||
      cameras.length === 0
    ) {

      scanStatus.innerText =
        "❌ Tiada kamera dijumpai.";

      return;

    }


    cameraSelect.innerHTML =
      "";


    cameras.forEach(
      function(
        camera,
        index
      ) {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          camera.id;


        option.text =
          camera.label ||
          "Kamera " +
          (
            index + 1
          );


        cameraSelect.appendChild(
          option
        );

      }
    );


    /*
     * Cari kamera belakang
     */

    let selected =
      cameras[0].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        (
          cameras[i].label ||
          ""
        ).toLowerCase();


      if (

        label.includes(
          "back"
        ) ||

        label.includes(
          "rear"
        ) ||

        label.includes(
          "environment"
        )

      ) {

        selected =
          cameras[i].id;

        break;

      }

    }


    cameraSelect.value =
      selected;


    startButton.disabled =
      false;


    scanStatus.innerText =
      "✅ Kamera tersedia. Tekan MULA SCAN.";


  } catch (error) {

    paparError(
      "Gagal mendapatkan kamera.\n\n" +
      "Jenis ralat: " +
      (
        error.name ||
        "Tidak diketahui"
      ) +
      "\n\nMesej: " +
      (
        error.message ||
        error
      )
    );


    scanStatus.innerText =
      "❌ Kamera tidak dapat diakses.";

  }

}


/* =========================================
   MULA SCAN
========================================= */

async function mulaScan() {

  if (
    sedangScan
  ) {

    return;

  }


  const cameraId =
    cameraSelect.value;


  if (!cameraId) {

    alert(
      "Sila pilih kamera."
    );

    return;

  }


  result.style.display =
    "none";


  errorBox.style.display =
    "none";


  scanSedangDiproses =
    false;


  scanStatus.innerText =
    "⏳ Membuka kamera...";


  try {

    scanner =
      new Html5Qrcode(
        "reader"
      );


    sedangScan =
      true;


    startButton.disabled =
      true;


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        }

      },


      function(
        decodedText
      ) {

        qrBerjaya(
          decodedText
        );

      },


      function(
        errorMessage
      ) {

        /*
         * Jangan papar error
         * scan biasa.
         */

        console.log(
          "SCAN:",
          errorMessage
        );

      }

    );


    scanStatus.innerText =
      "📷 KAMERA AKTIF\n\n" +
      "Halakan QR Code ke kotak.";


  } catch (error) {

    sedangScan =
      false;


    startButton.disabled =
      false;


    paparError(

      "Gagal membuka scanner.\n\n" +

      "Jenis ralat: " +
      (
        error.name ||
        "Tidak diketahui"
      ) +

      "\n\nMesej: " +
      (
        error.message ||
        error
      )

    );


    scanStatus.innerText =
      "❌ Gagal membuka kamera.";

  }

}


/* =========================================
   QR BERJAYA
========================================= */

async function qrBerjaya(
  decodedText
) {

  if (
    !sedangScan ||
    scanSedangDiproses
  ) {

    return;

  }


  scanSedangDiproses =
    true;


  sedangScan =
    false;


  scanStatus.innerText =
    "⏳ QR dibaca. Menghantar ke sistem...";


  /*
   * Hentikan kamera dahulu
   */

  try {

    await scanner.stop();

  } catch (error) {

    console.log(
      error
    );

  }


  try {

    scanner.clear();

  } catch (error) {

    console.log(
      error
    );

  }


  scanner =
    null;


  /*
   * Hantar ID ke Apps Script
   */

  try {

    const url =
      APPS_SCRIPT_URL +
      "?id=" +
      encodeURIComponent(
        decodedText
      ) +
      "&t=" +
      Date.now();


    console.log(
      "HANTAR:",
      url
    );


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "REKOD:",
      data
    );


    paparKeputusan(
      data,
      decodedText
    );


    /*
     * Update dashboard
     */

    await muatDashboard();


  } catch (error) {

    paparError(

      "Gagal berhubung dengan Apps Script.\n\n" +

      "ID QR: " +
      decodedText +

      "\n\n" +

      "Ralat: " +
      (
        error.message ||
        error
      )

    );

  }


  /*
   * Tunggu 3 saat
   * kemudian scan semula
   */

  setTimeout(
    function() {

      result.style.display =
        "none";


      errorBox.style.display =
        "none";


      scanSedangDiproses =
        false;


      if (
        cameras.length > 0
      ) {

        mulaScan();

      }

    },
    3000
  );

}


/* =========================================
   PAPAR KEPUTUSAN
========================================= */

function paparKeputusan(
  data,
  decodedText
) {

  result.style.display =
    "block";


  result.className =
    "";


  /*
   * BERJAYA
   */

  if (
    data.status ===
    "BERJAYA"
  ) {

    result.classList.add(
      "result-success"
    );


    resultIcon.innerText =
      "🎉";


    resultTitle.innerText =
      "KEHADIRAN BERJAYA";


    resultName.innerText =
      data.nama ||
      "Nama tidak diketahui";


    resultInfo.innerHTML =
      "🆔 ID: <b>" +
      escapeHtml(
        data.id ||
        decodedText
      ) +
      "</b><br>" +

      "📅 Tarikh: <b>" +
      escapeHtml(
        data.tarikh ||
        "-"
      ) +
      "</b><br>" +

      "🕐 Masa: <b>" +
      escapeHtml(
        data.masa ||
        "-"
      ) +
      "</b>";


    scanStatus.innerText =
      "✅ Kehadiran berjaya direkod.";

    return;

  }


  /*
   * SUDAH HADIR
   */

  if (
    data.status ===
    "SUDAH_HADIR"
  ) {

    result.classList.add(
      "result-warning"
    );


    resultIcon.innerText =
      "⚠️";


    resultTitle.innerText =
      "SUDAH HADIR";


    resultName.innerText =
      data.nama ||
      "Nama tidak diketahui";


    resultInfo.innerHTML =
      "🆔 ID: <b>" +
      escapeHtml(
        data.id ||
        decodedText
      ) +
      "</b><br>" +

      "📅 Tarikh: <b>" +
      escapeHtml(
        data.tarikh ||
        "-"
      ) +
      "</b><br><br>" +

      escapeHtml(
        data.message ||
        "Murid sudah direkod."
      );


    scanStatus.innerText =
      "⚠️ Murid sudah hadir hari ini.";

    return;

  }


  /*
   * ID TIDAK DIJUMPAI
   */

  if (
    data.status ===
    "TIDAK_DIJUMPAI"
  ) {

    result.classList.add(
      "result-error"
    );


    resultIcon.innerText =
      "❌";


    resultTitle.innerText =
      "ID TIDAK DIJUMPAI";


    resultName.innerText =
      "";


    resultInfo.innerHTML =
      "🆔 ID: <b>" +
      escapeHtml(
        data.id ||
        decodedText
      ) +
      "</b><br><br>" +

      escapeHtml(
        data.message ||
        "ID murid tidak dijumpai."
      );


    scanStatus.innerText =
      "❌ ID murid tidak dijumpai.";

    return;

  }


  /*
   * STATUS LAIN
   */

  result.classList.add(
    "result-error"
  );


  resultIcon.innerText =
    "❌";


  resultTitle.innerText =
    "GAGAL";


  resultName.innerText =
    "";


  resultInfo.innerText =
    data.message ||
    "Gagal merekod kehadiran.";


  scanStatus.innerText =
    "❌ Gagal merekod.";

}


/* =========================================
   HENTIKAN SCAN
========================================= */

async function hentikanScan() {

  sedangScan =
    false;


  scanSedangDiproses =
    false;


  if (
    scanner
  ) {

    try {

      await scanner.stop();

    } catch (
      error
    ) {

      console.log(
        error
      );

    }


    try {

      scanner.clear();

    } catch (
      error
    ) {

      console.log(
        error
      );

    }


    scanner =
      null;

  }


  startButton.disabled =
    false;


  scanStatus.innerText =
    "⛔ Scanner dihentikan.";

}


/* =========================================
   ERROR
========================================= */

function paparError(
  error
) {

  console.error(
    error
  );


  errorBox.style.display =
    "block";


  errorBox.innerText =
    "❌ RALAT\n\n" +
    error;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      text ?? ""
    );


  return div.innerHTML;

}


/* =========================================
   AUTO REFRESH DASHBOARD
========================================= */

/*
 * Refresh setiap 30 saat.
 */

setInterval(
  function() {

    muatDashboard();

  },
  30000
);


/* =========================================
   START
========================================= */

window.addEventListener(
  "load",
  function() {

    /*
     * Dashboard dahulu
     */

    muatDashboard();


    /*
     * Kemudian kamera
     */

    if (
      typeof Html5Qrcode ===
      "undefined"
    ) {

      paparError(
        "Library html5-qrcode gagal dimuat."
      );

      return;

    }


    cariKamera();

  }
);


</script>
