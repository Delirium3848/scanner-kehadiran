<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Kehadiran Murid</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family: Arial, sans-serif;

  background:
    linear-gradient(
      135deg,
      #0f172a,
      #1e3a8a
    );

  color: white;

  text-align: center;

}

.container {

  width: 100%;

  max-width: 500px;

  margin: auto;

  padding: 20px;

}

h1 {

  margin: 10px 0 5px;

  font-size: 28px;

}

.subtitle {

  opacity: .85;

  margin-bottom: 20px;

}


.scanner-box {

  background: white;

  border-radius: 20px;

  padding: 10px;

  overflow: hidden;

}


#reader {

  width: 100%;

}


.status {

  margin-top: 15px;

  padding: 15px;

  border-radius: 15px;

  background:
    rgba(255,255,255,.12);

  font-size: 16px;

  line-height: 1.5;

  white-space: pre-wrap;

}


button {

  width: 100%;

  padding: 15px;

  margin-top: 15px;

  border: none;

  border-radius: 12px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}


#startBtn {

  background: #22c55e;

  color: white;

}


#stopBtn {

  background: #ef4444;

  color: white;

}


.result {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 9999;

  background:
    rgba(0,0,0,.75);

  align-items: center;

  justify-content: center;

  padding: 20px;

}


.result-card {

  width: 100%;

  max-width: 400px;

  background: white;

  color: #111827;

  border-radius: 25px;

  padding: 30px 20px;

  animation:
    muncul .25s ease;

}


@keyframes muncul {

  from {

    transform: scale(.8);

    opacity: 0;

  }

  to {

    transform: scale(1);

    opacity: 1;

  }

}


.icon {

  font-size: 60px;

}


.title {

  font-size: 20px;

  font-weight: bold;

  margin-top: 10px;

}


.nama {

  font-size: 28px;

  font-weight: bold;

  margin: 12px 0;

}


.info {

  font-size: 16px;

  line-height: 1.8;

}


.success {

  color: #16a34a;

}


.warning {

  color: #d97706;

}


.danger {

  color: #dc2626;

}


</style>

</head>


<body>


<div class="container">

  <h1>
    📷 KEHADIRAN MURID
  </h1>

  <div class="subtitle">
    Imbas QR Code untuk merekod kehadiran
  </div>


  <div class="scanner-box">

    <div id="reader"></div>

  </div>


  <div
    id="status"
    class="status">

    Tekan MULA SCAN

  </div>


  <button
    id="startBtn"
    onclick="mulaScan()">

    📷 MULA SCAN

  </button>


  <button
    id="stopBtn"
    onclick="hentiScan()">

    ⛔ HENTIKAN SCAN

  </button>


</div>



<!-- POPUP -->

<div
  id="resultPopup"
  class="result">

  <div class="result-card">

    <div
      id="popupIcon"
      class="icon">

      ✅

    </div>


    <div
      id="popupTitle"
      class="title">

      KEHADIRAN BERJAYA

    </div>


    <div
      id="popupNama"
      class="nama">

    </div>


    <div
      id="popupInfo"
      class="info">

    </div>

  </div>

</div>



<script>


/************************************************
 * URL APPS SCRIPT BACKEND
 ************************************************/

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx4WM4cm1rNr8QePCjtsRtA4G2_vyQN96Q_KTN7eYkqTqPG5t1Mt65tINazBFtNh9yg/exec";



/************************************************
 * PEMBOLEHUBAH
 ************************************************/

let scanner = null;

let sedangScan = false;

let sedangProses = false;



/************************************************
 * STATUS
 ************************************************/

function setStatus(text) {

  document.getElementById(
    "status"
  ).innerText = text;

}



/************************************************
 * MULA SCAN
 ************************************************/

async function mulaScan() {

  if (sedangScan) {

    return;

  }


  sedangProses = false;


  setStatus(
    "⏳ Membuka kamera..."
  );


  try {

    /*
     * Cari kamera
     */

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "Tiada kamera dijumpai."
      );

    }


    /*
     * Pilih kamera belakang
     */

    let cameraId =
      cameras[0].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        (
          cameras[i].label ||
          ""
        ).toLowerCase();


      if (

        label.includes("back") ||

        label.includes("rear") ||

        label.includes("environment")

      ) {

        cameraId =
          cameras[i].id;

        break;

      }

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    sedangScan = true;


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        }

      },


      function(decodedText) {

        qrDikesan(
          decodedText
        );

      },


      function() {

        /*
         * Abaikan error scan biasa
         */

      }

    );


    setStatus(
      "📷 KAMERA AKTIF\n\n" +
      "Halakan QR Code ke kotak."
    );


  } catch (error) {

    sedangScan = false;

    scanner = null;


    setStatus(
      "❌ GAGAL MEMBUKA KAMERA\n\n" +
      error.message
    );


    console.error(error);

  }

}



/************************************************
 * QR DIKESAN
 ************************************************/

async function qrDikesan(
  decodedText
) {

  if (
    !sedangScan ||
    sedangProses
  ) {

    return;

  }


  sedangProses = true;


  const idMurid =
    String(
      decodedText
    ).trim();


  setStatus(
    "⏳ QR DIKESAN\n\n" +
    "ID: " +
    idMurid +
    "\n\n" +
    "Semak rekod..."
  );


  /*
   * Hentikan kamera sementara
   */

  try {

    await scanner.stop();

  } catch (error) {

    console.log(error);

  }


  /*
   * Hantar ke Apps Script
   */

  const url =
    APPS_SCRIPT_URL +
    "?id=" +
    encodeURIComponent(
      idMurid
    );


  try {

    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    console.log(
      "RESPON:",
      data
    );


    paparKeputusan(
      data
    );


  } catch (error) {

    console.error(
      error
    );


    paparKeputusan({

      success: false,

      status: "RALAT",

      message:
        "Tidak dapat berhubung dengan Google Apps Script."

    });

  }

}



/************************************************
 * PAPAR KEPUTUSAN
 ************************************************/

function paparKeputusan(
  data
) {

  const popup =
    document.getElementById(
      "resultPopup"
    );


  const icon =
    document.getElementById(
      "popupIcon"
    );


  const title =
    document.getElementById(
      "popupTitle"
    );


  const nama =
    document.getElementById(
      "popupNama"
    );


  const info =
    document.getElementById(
      "popupInfo"
    );


  popup.style.display =
    "flex";


  /*
   * BERJAYA
   */

  if (

    data.success === true &&

    data.status ===
      "BERJAYA"

  ) {

    icon.innerText =
      "🎉";


    title.innerText =
      "KEHADIRAN BERJAYA";


    title.className =
      "title success";


    nama.innerText =
      data.nama ||
      "Murid";


    info.innerHTML =

      "🆔 ID: " +
      escapeHtml(
        data.id
      ) +

      "<br>" +

      "📅 Tarikh: " +
      escapeHtml(
        data.tarikh
      ) +

      "<br>" +

      "🕐 Masa: " +
      escapeHtml(
        data.masa
      );


  }


  /*
   * SUDAH HADIR
   */

  else if (

    data.success === true &&

    data.status ===
      "SUDAH_HADIR"

  ) {

    icon.innerText =
      "⚠️";


    title.innerText =
      "SUDAH HADIR";


    title.className =
      "title warning";


    nama.innerText =
      data.nama ||
      "Murid";


    info.innerHTML =

      "🆔 ID: " +
      escapeHtml(
        data.id
      ) +

      "<br><br>" +

      "Murid ini sudah direkod hadir hari ini.";

  }


  /*
   * TIDAK DIJUMPAI
   */

  else if (

    data.status ===
      "TIDAK_DIJUMPAI"

  ) {

    icon.innerText =
      "❌";


    title.innerText =
      "ID TIDAK DIJUMPAI";


    title.className =
      "title danger";


    nama.innerText =
      data.id ||
      "Tidak diketahui";


    info.innerText =
      "ID ini tidak terdapat dalam sheet MURID.";

  }


  /*
   * ERROR
   */

  else {

    icon.innerText =
      "❌";


    title.innerText =
      "RALAT";


    title.className =
      "title danger";


    nama.innerText =
      "Gagal";


    info.innerText =
      data.message ||
      "Ralat tidak diketahui.";

  }


  /*
   * Popup 3 saat
   */

  setTimeout(
    function() {

      popup.style.display =
        "none";


      sambungScan();

    },

    3000

  );

}



/************************************************
 * SAMBUNG SCAN SEMULA
 ************************************************/

async function sambungScan() {

  sedangProses = false;


  /*
   * Jika scanner hilang,
   * mula scanner baru
   */

  if (!scanner) {

    mulaScan();

    return;

  }


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      mulaScan();

      return;

    }


    let cameraId =
      cameras[0].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        (
          cameras[i].label ||
          ""
        ).toLowerCase();


      if (

        label.includes("back") ||

        label.includes("rear") ||

        label.includes("environment")

      ) {

        cameraId =
          cameras[i].id;

        break;

      }

    }


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        }

      },


      function(decodedText) {

        qrDikesan(
          decodedText
        );

      },


      function() {}

    );


    sedangScan = true;


    setStatus(
      "📷 SILA SCAN MURID SETERUSNYA"
    );


  } catch (error) {

    console.error(
      error
    );


    sedangScan = false;


    setStatus(
      "❌ Gagal sambung scanner.\n\n" +
      error.message
    );

  }

}



/************************************************
 * HENTIKAN SCAN
 ************************************************/

async function hentiScan() {

  sedangScan = false;

  sedangProses = false;


  if (scanner) {

    try {

      await scanner.stop();

    } catch (error) {

      console.log(error);

    }


    try {

      scanner.clear();

    } catch (error) {

      console.log(error);

    }


    scanner = null;

  }


  document.getElementById(
    "reader"
  ).innerHTML = "";


  setStatus(
    "⛔ Scanner dihentikan."
  );

}



/************************************************
 * ESCAPE HTML
 ************************************************/

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


</script>

</body>

</html>
