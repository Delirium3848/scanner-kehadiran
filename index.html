<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Scan Kehadiran</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fa;
  text-align:center;
}

h1{
  margin-top:15px;
  margin-bottom:5px;
}

p{
  margin-top:0;
  color:#666;
}

#reader{
  width:100%;
  max-width:500px;
  margin:auto;
}

#popup{

  position:fixed;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  min-width:280px;

  padding:25px;

  border-radius:20px;

  font-size:28px;

  font-weight:bold;

  color:white;

  display:none;

  z-index:9999;
}

.success{
  background:#16a34a;
}

.warning{
  background:#ca8a04;
}

.danger{
  background:#dc2626;
}

</style>

</head>
<body>

<h1>📷 SCAN KEHADIRAN</h1>
<p>Imbas QR Code murid</p>

<div id="reader"></div>

<div id="popup"></div>

<script>

/******************************************
 APPS SCRIPT URL
******************************************/

const API =
"https://script.google.com/macros/s/AKfycbx4WM4cm1rNr8QePCjtsRtA4G2_vyQN96Q_KTN7eYkqTqPG5t1Mt65tINazBFtNh9yg/exec";

let scanner;
let sedangProses=false;

/******************************************
 POPUP
******************************************/

function popup(msg,kelas){

 const p=document.getElementById("popup");

 p.className=kelas;

 p.innerHTML=msg;

 p.style.display="block";

 setTimeout(()=>{

   p.style.display="none";

 },2000);

}

/******************************************
 SUARA PEREMPUAN
******************************************/

function cakap(text){

  try{

    speechSynthesis.cancel();

    const suara =
      new SpeechSynthesisUtterance(text);


    /*
     * BAHASA MELAYU
     */
    suara.lang = "ms-MY";


    /*
     * KELAJUAN
     */
    suara.rate = 0.9;


    /*
     * NADA
     *
     * Sedikit tinggi supaya
     * bunyi lebih feminin
     */
    suara.pitch = 1.15;


    /*
     * VOLUME
     */
    suara.volume = 1.0;


    /*
     * DAPATKAN SEMUA VOICE
     */
    const voices =
      speechSynthesis.getVoices();


    /*
     * CARI VOICE MELAYU
     */
    let voice =
      voices.find(
        v =>
          (
            v.lang || ""
          )
          .toLowerCase()
          .startsWith("ms")
      );


    /*
     * Jika ada nama voice yang
     * menunjukkan suara perempuan,
     * utamakan voice tersebut.
     */

    const femaleKeywords = [

      "female",
      "woman",
      "girl",
      "siti",
      "melayu",
      "malay"

    ];


    const femaleVoice =
      voices.find(
        v => {

          const name =
            (
              v.name || ""
            ).toLowerCase();


          const lang =
            (
              v.lang || ""
            ).toLowerCase();


          return (

            lang.startsWith("ms") &&

            femaleKeywords.some(
              keyword =>
                name.includes(keyword)
            )

          );

        }
      );


    if(femaleVoice){

      voice =
        femaleVoice;

    }


    /*
     * JIKA TIADA VOICE MELAYU
     * CUBA INDONESIA
     */

    if(!voice){

      voice =
        voices.find(
          v =>
            (
              v.lang || ""
            )
            .toLowerCase()
            .startsWith("id")
        );

    }


    /*
     * JIKA MASIH TIADA,
     * CUBA VOICE ENGLISH FEMALE
     */

    if(!voice){

      voice =
        voices.find(
          v => {

            const name =
              (
                v.name || ""
              ).toLowerCase();


            return (

              (
                v.lang || ""
              )
              .toLowerCase()
              .startsWith("en") &&

              femaleKeywords.some(
                keyword =>
                  name.includes(keyword)
              )

            );

          }
        );

    }


    if(voice){

      suara.voice =
        voice;

      console.log(
        "VOICE DIPILIH:",
        voice.name,
        voice.lang
      );

    }


    speechSynthesis.speak(
      suara
    );


  }catch(e){

    console.log(
      "Ralat suara:",
      e
    );

  }

}
/******************************************
 SCAN BERJAYA
******************************************/

async function onScanSuccess(qrText){

 if(sedangProses) return;

 sedangProses=true;

 try{

   const url=
   API+
   "?id="+encodeURIComponent(qrText)+
   "&t="+Date.now();

   const res=
   await fetch(url);

   const data=
   await res.json();

   if(data.status==="BERJAYA"){

      cakap("Terima kasih");

      popup(
      "✅<br>BERJAYA DIREKOD",
      "success"
      );

   }

   else if(data.status==="SUDAH_HADIR"){

      cakap("Sudah hadir");

      popup(
      "⚠️<br>SUDAH HADIR",
      "warning"
      );

   }

   else{

      cakap("ID tidak dijumpai");

      popup(
      "❌<br>ID TIDAK DIJUMPAI",
      "danger"
      );

   }

 }catch(err){

   popup(
   "❌<br>RALAT",
   "danger"
   );

 }

 setTimeout(()=>{

   sedangProses=false;

 },2000);

}

/******************************************
 MULA CAMERA AUTOMATIK
******************************************/

async function mula(){

 try{

   const cameras=
   await Html5Qrcode.getCameras();

   if(!cameras.length){

      popup(
      "❌<br>TIADA KAMERA",
      "danger"
      );

      return;
   }

   scanner=
   new Html5Qrcode("reader");

   await scanner.start(

      cameras[0].id,

      {
        fps:10,
        qrbox:250
      },

      onScanSuccess

   );

 }catch(err){

   popup(
   "❌<br>KAMERA GAGAL",
   "danger"
   );

 }

}

window.onload=mula;

</script>

</body>
</html>
